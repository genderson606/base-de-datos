<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DinoStore 🦖</title>
    <!-- SDK de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #121826;
            --card-bg: #1f293d;
            --accent: #10b981;
            --accent-hover: #059669;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* HEADER */
        header {
            background-color: var(--card-bg);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .nav-actions {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .btn {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
        }

        .btn-outline:hover {
            background: var(--accent);
            color: white;
        }

        /* LAYOUT PRINCIPAL */
        container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
            flex: 1;
            width: 100%;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1.5rem;
        }

        /* CARD DE PRODUCTO */
        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-4px);
        }

        .card-body {
            padding: 1.25rem;
        }

        .card-title {
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
        }

        .card-price {
            font-size: 1.1rem;
            color: var(--accent);
            font-weight: bold;
            margin-bottom: 1rem;
        }

        /* MODALES */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: 12px;
            width: 90%;
            max-width: 450px;
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-muted);
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem;
            border-radius: 6px;
            border: 1px solid #374151;
            background-color: #111827;
            color: white;
        }

        /* CARRITO SLIDE-OVER */
        .cart-drawer {
            position: fixed;
            top: 0;
            right: -400px;
            width: 350px;
            height: 100%;
            background-color: var(--card-bg);
            box-shadow: -5px 0 15px rgba(0,0,0,0.5);
            transition: right 0.3s ease;
            z-index: 90;
            display: flex;
            flex-direction: column;
            padding: 1.5rem;
        }

        .cart-drawer.open {
            right: 0;
        }

        .cart-items {
            flex: 1;
            overflow-y: auto;
            margin: 1rem 0;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 0;
            border-bottom: 1px solid #374151;
        }

        /* NOTIFICACIONES TOAST */
        #notification {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: var(--accent);
            color: white;
            padding: 1rem 1.5rem;
            border-radius: 8px;
            display: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            z-index: 200;
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header>
        <div class="logo">🦖 DinoStore</div>
        <div class="nav-actions">
            <div id="user-info" style="display: none; align-items: center; gap: 0.5rem;">
                <span id="user-email" style="font-size: 0.9rem; color: var(--text-muted);"></span>
                <button class="btn btn-outline" onclick="logout()">Cerrar Sesión</button>
            </div>
            <button id="login-btn" class="btn btn-outline" onclick="openAuthModal('login')">Iniciar Sesión</button>
            <button class="btn" onclick="toggleCart()">🛒 Carrito (<span id="cart-count">0</span>)</button>
        </div>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <container>
        <h1 style="margin-bottom: 1.5rem;">Catálogo de Dinosaurios</h1>
        <div id="product-grid" class="grid">
            <!-- Los productos se cargarán dinámicamente -->
        </div>
    </container>

    <!-- CARRITO DE COMPRAS -->
    <div id="cart-drawer" class="cart-drawer">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h2>Tu Carrito</h2>
            <button class="close-btn" onclick="toggleCart()">&times;</button>
        </div>
        <div id="cart-items" class="cart-items"></div>
        <div>
            <h3>Total: $<span id="cart-total">0.00</span></h3>
            <button class="btn" style="width: 100%; margin-top: 1rem;" onclick="checkout()">Comprar Ahora</button>
        </div>
    </div>

    <!-- MODAL AUTENTICACIÓN -->
    <div id="auth-modal" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeAuthModal()">&times;</button>
            <h2 id="modal-title" style="margin-bottom: 1.5rem;">Iniciar Sesión</h2>
            <form id="auth-form" onsubmit="handleAuth(event)">
                <div class="form-group">
                    <label>Correo Electrónico</label>
                    <input type="email" id="auth-email" required placeholder="tu@email.com">
                </div>
                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" id="auth-password" required placeholder="••••••••">
                </div>
                <button type="submit" id="auth-submit-btn" class="btn" style="width: 100%;">Ingresar</button>
            </form>
            <p style="margin-top: 1rem; font-size: 0.9rem; text-align: center; color: var(--text-muted);">
                <span id="auth-switch-text">¿No tienes cuenta?</span>
                <a href="#" id="auth-switch-link" onclick="toggleAuthMode(event)" style="color: var(--accent);">Regístrate</a>
            </p>
        </div>
    </div>

    <!-- NOTIFICACIÓN -->
    <div id="notification"></div>

    <script>
        // --- CONFIGURACIÓN DE SUPABASE ---
        const SUPABASE_URL = 'https://olfheyzynklvcurgxyjh.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9sZmhleXp5bmtsdmN1cmd4eWpoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODczMTY5NTYsImV4cCI6MjEwMjg5Mjk1Nn0.lfZoX7m68w9f41MmKiFAPN0QfXwPoSlRRFkfqFziP-A';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ESTADO GLOBAL
        let currentUser = null;
        let authMode = 'login'; // 'login' o 'signup'
        let cart = [];

        const products = [
            { id: 1, name: 'Tyrannosaurus Rex', price: 15000 },
            { id: 2, name: 'Triceratops', price: 8500 },
            { id: 3, name: 'Velociraptor', price: 4200 },
            { id: 4, name: 'Brachiosaurus', price: 18000 },
            { id: 5, name: 'Ankylosaurus', price: 7500 },
            { id: 6, name: 'Spinosaurus', price: 16000 }
        ];

        // INICIALIZACIÓN
        document.addEventListener('DOMContentLoaded', async () => {
            renderProducts();
            
            // Verificar sesión activa en Supabase
            const { data: { session } } = await _supabase.auth.getSession();
            if (session) {
                currentUser = session.user;
                updateAuthUI();
            }

            // Escuchar cambios de autenticación
            _supabase.auth.onAuthStateChange((_event, session) => {
                currentUser = session ? session.user : null;
                updateAuthUI();
            });
        });

        // RENDERIZAR PRODUCTOS
        function renderProducts() {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = products.map(p => `
                <div class="card">
                    <div class="card-body">
                        <h3 class="card-title">${p.name}</h3>
                        <p class="card-price">$${p.price.toLocaleString()}</p>
                        <button class="btn" style="width: 100%;" onclick="addToCart(${p.id})">Agregar al Carrito</button>
                    </div>
                </div>
            `).join('');
        }

        // GESTIÓN DEL CARRITO
        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            const existing = cart.find(item => item.id === productId);

            if (existing) {
                existing.quantity++;
            } else {
                cart.push({ ...product, quantity: 1 });
            }

            updateCartUI();
            showNotification(`${product.name} agregado al carrito!`);
        }

        function updateCartUI() {
            const cartItems = document.getElementById('cart-items');
            const cartCount = document.getElementById('cart-count');
            const cartTotal = document.getElementById('cart-total');

            cartCount.textContent = cart.reduce((sum, item) => sum + item.quantity, 0);

            cartItems.innerHTML = cart.map(item => `
                <div class="cart-item">
                    <div>
                        <strong>${item.name}</strong><br>
                        <small>$${item.price} x ${item.quantity}</small>
                    </div>
                    <div>$${(item.price * item.quantity).toLocaleString()}</div>
                </div>
            `).join('');

            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            cartTotal.textContent = total.toLocaleString();
        }

        function toggleCart() {
            document.getElementById('cart-drawer').classList.toggle('open');
        }

        // --- CHECKOUT CON PERSISTENCIA EN SUPABASE ---
        async function checkout() {
            if (!currentUser) {
                alert('¡Inicia sesión para completar tu compra!');
                toggleCart();
                openAuthModal('login');
                return;
            }

            if (cart.length === 0) {
                alert('El carrito está vacío');
                return;
            }

            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);

            try {
                // 1. Insertar pedido en la tabla 'pedidos'
                const { data: pedido, error: errorPedido } = await _supabase
                    .from('pedidos')
                    .insert([{ user_id: currentUser.id, total: total }])
                    .select()
                    .single();

                if (errorPedido) throw errorPedido;

                // 2. Preparar registros para la tabla 'detalles_pedido'
                const detalles = cart.map(item => ({
                    pedido_id: pedido.id,
                    producto_id: item.id,
                    cantidad: item.quantity,
                    precio_unitario: item.price
                }));

                // 3. Insertar detalles
                const { error: errorDetalles } = await _supabase
                    .from('detalles_pedido')
                    .insert(detalles);

                if (errorDetalles) throw errorDetalles;

                // 4. Resetear estado
                showNotification('¡Compra registrada en Supabase con éxito! 🦖');
                cart = [];
                updateCartUI();
                toggleCart();

            } catch (err) {
                console.error('Error al procesar checkout:', err);
                alert('Hubo un error al procesar tu compra: ' + err.message);
            }
        }

        // --- AUTENTICACIÓN ---
        function openAuthModal(mode) {
            authMode = mode;
            const modal = document.getElementById('auth-modal');
            const title = document.getElementById('modal-title');
            const submitBtn = document.getElementById('auth-submit-btn');
            const switchText = document.getElementById('auth-switch-text');
            const switchLink = document.getElementById('auth-switch-link');

            if (mode === 'login') {
                title.textContent = 'Iniciar Sesión';
                submitBtn.textContent = 'Ingresar';
                switchText.textContent = '¿No tienes cuenta?';
                switchLink.textContent = 'Regístrate';
            } else {
                title.textContent = 'Crear Cuenta';
                submitBtn.textContent = 'Registrarse';
                switchText.textContent = '¿Ya tienes cuenta?';
                switchLink.textContent = 'Inicia sesión';
            }

            modal.classList.add('active');
        }

        function closeAuthModal() {
            document.getElementById('auth-modal').classList.remove('active');
        }

        function toggleAuthMode(e) {
            e.preventDefault();
            openAuthModal(authMode === 'login' ? 'signup' : 'login');
        }

        async function handleAuth(e) {
            e.preventDefault();
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;

            try {
                if (authMode === 'login') {
                    const { error } = await _supabase.auth.signInWithPassword({ email, password });
                    if (error) throw error;
                    showNotification('¡Sesión iniciada!');
                } else {
                    const { error } = await _supabase.auth.signUp({ email, password });
                    if (error) throw error;
                    showNotification('¡Registro completado! Revisa tu correo.');
                }
                closeAuthModal();
            } catch (err) {
                alert(err.message);
            }
        }

        async function logout() {
            await _supabase.auth.signOut();
            showNotification('Sesión cerrada');
        }

        function updateAuthUI() {
            const userInfo = document.getElementById('user-info');
            const loginBtn = document.getElementById('login-btn');
            const userEmail = document.getElementById('user-email');

            if (currentUser) {
                userEmail.textContent = currentUser.email;
                userInfo.style.display = 'flex';
                loginBtn.style.display = 'none';
            } else {
                userInfo.style.display = 'none';
                loginBtn.style.display = 'block';
            }
        }

        // NOTIFICACIÓN FLOTANTE
        function showNotification(msg) {
            const notif = document.getElementById('notification');
            notif.textContent = msg;
            notif.style.display = 'block';
            setTimeout(() => {
                notif.style.display = 'none';
            }, 3000);
        }
    </script>
</body>
</html>
