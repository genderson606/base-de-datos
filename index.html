<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DinoStore</title>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
        }

        /* Navbar */
        nav {
            background-color: #1e293b;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: #10b981;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .nav-buttons {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .btn {
            background-color: #10b981;
            color: #0f172a;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 0.375rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: #059669;
        }

        .btn-outline {
            background-color: transparent;
            color: #10b981;
            border: 1px solid #10b981;
        }

        .btn-outline:hover {
            background-color: rgba(16, 185, 129, 0.1);
        }

        /* Main Layout */
        main {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        h2 {
            margin-bottom: 1.5rem;
            font-size: 1.875rem;
        }

        /* Product Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background-color: #1e293b;
            border-radius: 0.75rem;
            overflow: hidden;
            border: 1px solid #334155;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }

        .card-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            display: block;
            background-color: #0f172a;
        }

        .card-body {
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex-grow: 1;
            gap: 1rem;
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 600;
        }

        .card-price {
            color: #10b981;
            font-size: 1.125rem;
            font-weight: bold;
        }

        /* Modals */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.75);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background-color: #1e293b;
            padding: 2rem;
            border-radius: 0.75rem;
            width: 100%;
            max-width: 450px;
            border: 1px solid #334155;
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
            color: #94a3b8;
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem;
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 0.375rem;
            color: #fff;
            outline: none;
        }

        .form-group input:focus {
            border-color: #10b981;
        }

        /* Cart Styling */
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 0;
            border-bottom: 1px solid #334155;
        }

        .cart-total {
            margin-top: 1rem;
            text-align: right;
            font-size: 1.25rem;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">
            🦖 DinoStore
        </div>
        <div class="nav-buttons">
            <span id="userGreeting" style="display: none; font-size: 0.9rem; color: #94a3b8;"></span>
            <button class="btn btn-outline" id="authBtn" onclick="toggleAuthModal()">Iniciar Sesión</button>
            <button class="btn" onclick="toggleCartModal()">🛒 Carrito (<span id="cartCount">0</span>)</button>
        </div>
    </nav>

    <main>
        <h2>Catálogo de Dinosaurios</h2>
        <div class="grid" id="productsContainer">
            <!-- Los productos se cargarán dinámicamente aquí -->
        </div>
    </main>

    <!-- Modal de Autenticación -->
    <div class="modal" id="authModal">
        <div class="modal-content">
            <button class="close-btn" onclick="toggleAuthModal()">&times;</button>
            <h3 id="authTitle" style="margin-bottom: 1rem;">Iniciar Sesión</h3>
            <form id="authForm" onsubmit="handleAuth(event)">
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" required>
                </div>
                <button type="submit" class="btn" style="width: 100%; margin-top: 0.5rem;" id="authSubmitBtn">Ingresar</button>
            </form>
            <p style="margin-top: 1rem; font-size: 0.875rem; text-align: center; color: #94a3b8;">
                <span id="authToggleText">¿No tienes cuenta?</span> 
                <a href="#" onclick="switchAuthMode(event)" id="authToggleLink" style="color: #10b981;">Regístrate</a>
            </p>
        </div>
    </div>

    <!-- Modal del Carrito -->
    <div class="modal" id="cartModal">
        <div class="modal-content">
            <button class="close-btn" onclick="toggleCartModal()">&times;</button>
            <h3 style="margin-bottom: 1rem;">Tu Carrito</h3>
            <div id="cartItems">
                <p style="color: #94a3b8;">El carrito está vacío.</p>
            </div>
            <div class="cart-total" id="cartTotalLayout" style="display: none;">
                Total: $<span id="cartTotal">0</span>
            </div>
            <button class="btn" id="checkoutBtn" style="width: 100%; margin-top: 1rem; display: none;" onclick="checkout()">Realizar Pedido</button>
        </div>
    </div>

    <script>
        // CONFIGURACIÓN DE SUPABASE (Tus credenciales reales)
        const SUPABASE_URL = 'https://wzftdnyvhqvhcbsesnhw.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind6ZnRkbnl2aHF2aGNic2Vzbmh3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDEyMDIxNDYsImV4cCI6MjA1Njc3ODE0Nn0.2vX128b9_RBy7oK2Wn1O_V2n4zS3X2n8pY2Z9vX128b';
        
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Variables de estado
        let products = [];
        let cart = [];
        let isSignUp = false;
        let currentUser = null;

        // Lista de respaldo local con las imágenes exactamente como están en tu GitHub
        const fallbackProducts = [
            { id: 1, name: 'Ankylosaurus', price: 7500, image: 'anjylosaurus.jpg' },
            { id: 2, name: 'Pteranodon', price: 6000, image: 'pteranodon.jpg' },
            { id: 3, name: 'Raptóridos', price: 5500, image: 'raptoridos.jpg' },
            { id: 4, name: 'Stegosaurio', price: 8000, image: 'stegosaurio.jpg' },
            { id: 5, name: 'Tyrannosaurus Rex', price: 15000, image: 'trexpnso.jpg' },
            { id: 6, name: 'Triceratops', price: 8500, image: 'triceratop.jpg' }
        ];

        // Inicializar aplicación
        document.addEventListener('DOMContentLoaded', async () => {
            await checkUser();
            await initializeProducts();
        });

        // Verificación de usuario
        async function checkUser() {
            const { data: { user } } = await _supabase.auth.getUser();
            currentUser = user;
            const authBtn = document.getElementById('authBtn');
            const userGreeting = document.getElementById('userGreeting');

            if (user) {
                authBtn.innerText = 'Cerrar Sesión';
                authBtn.onclick = handleLogout;
                userGreeting.innerText = `Hola, ${user.email.split('@')[0]}`;
                userGreeting.style.display = 'inline';
            } else {
                authBtn.innerText = 'Iniciar Sesión';
                authBtn.onclick = toggleAuthModal;
                userGreeting.style.display = 'none';
            }
        }

        // Cargar productos de Supabase o Local Fallback
        async function initializeProducts() {
            const container = document.getElementById('productsContainer');
            
            let { data: productosSupabase, error } = await _supabase.from('productos').select('*');

            if (!error && productosSupabase && productosSupabase.length > 0) {
                products = productosSupabase.map(p => {
                    let img = p.image_url || 'trexpnso.jpg';
                    // Reemplaza extensiones .avif por .jpg si viene de la BD antigua
                    if (img.includes('.avif')) {
                        img = img.replace('.avif', '.jpg');
                    }
                    return {
                        id: p.id,
                        name: p.name,
                        price: p.price,
                        image: img
                    };
                });
            } else {
                products = fallbackProducts;
            }

            container.innerHTML = ''; 

            products.forEach(product => {
                const productCard = document.createElement('div');
                productCard.className = 'card';
                productCard.innerHTML = `
                    <img src="${product.image}" alt="${product.name}" class="card-img" onerror="this.onerror=null; this.src='trexpnso.jpg';">
                    <div class="card-body">
                        <div>
                            <h3 class="card-title">${product.name}</h3>
                            <p class="card-price">$${Number(product.price).toLocaleString()}</p>
                        </div>
                        <button class="btn" style="width: 100%;" onclick="addToCart(${product.id})">Agregar al Carrito</button>
                    </div>
                `;
                container.appendChild(productCard);
            });
        }

        // Carrito
        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            if (product) {
                cart.push(product);
                updateCartUI();
            }
        }

        function updateCartUI() {
            document.getElementById('cartCount').innerText = cart.length;
            const cartItemsContainer = document.getElementById('cartItems');
            const cartTotalLayout = document.getElementById('cartTotalLayout');
            const checkoutBtn = document.getElementById('checkoutBtn');

            if (cart.length === 0) {
                cartItemsContainer.innerHTML = '<p style="color: #94a3b8;">El carrito está vacío.</p>';
                cartTotalLayout.style.display = 'none';
                checkoutBtn.style.display = 'none';
                return;
            }

            cartItemsContainer.innerHTML = '';
            let total = 0;

            cart.forEach((item, index) => {
                total += Number(item.price);
                const itemEl = document.createElement('div');
                itemEl.className = 'cart-item';
                itemEl.innerHTML = `
                    <div>
                        <strong>${item.name}</strong>
                        <br>
                        <small style="color: #10b981;">$${Number(item.price).toLocaleString()}</small>
                    </div>
                    <button class="btn btn-outline" style="padding: 0.25rem 0.5rem;" onclick="removeFromCart(${index})">X</button>
                `;
                cartItemsContainer.appendChild(itemEl);
            });

            document.getElementById('cartTotal').innerText = total.toLocaleString();
            cartTotalLayout.style.display = 'block';
            checkoutBtn.style.display = 'block';
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartUI();
        }

        // Proceso de Compra
        async function checkout() {
            if (!currentUser) {
                alert('Debes iniciar sesión para realizar la compra.');
                toggleCartModal();
                toggleAuthModal();
                return;
            }

            const total = cart.reduce((sum, item) => sum + Number(item.price), 0);

            try {
                // 1. Guardar en tabla "pedidos"
                const { data: pedido, error: errorPedido } = await _supabase
                    .from('pedidos')
                    .insert([{ user_id: currentUser.id, total: total }])
                    .select()
                    .single();

                if (errorPedido) throw errorPedido;

                // 2. Guardar en tabla "detalles_pedido"
                const detalles = cart.map(item => ({
                    pedido_id: pedido.id,
                    producto_id: item.id,
                    cantidad: 1,
                    precio_unitario: item.price
                }));

                const { error: errorDetalles } = await _supabase
                    .from('detalles_pedido')
                    .insert(detalles);

                if (errorDetalles) throw errorDetalles;

                alert('¡Compra realizada con éxito! 🦖');
                cart = [];
                updateCartUI();
                toggleCartModal();

            } catch (err) {
                alert('Error al procesar la compra: ' + err.message);
            }
        }

        // Modales
        function toggleAuthModal() {
            const modal = document.getElementById('authModal');
            modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
        }

        function toggleCartModal() {
            const modal = document.getElementById('cartModal');
            modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
        }

        function switchAuthMode(e) {
            e.preventDefault();
            isSignUp = !isSignUp;
            document.getElementById('authTitle').innerText = isSignUp ? 'Registrarse' : 'Iniciar Sesión';
            document.getElementById('authSubmitBtn').innerText = isSignUp ? 'Crear Cuenta' : 'Ingresar';
            document.getElementById('authToggleText').innerText = isSignUp ? '¿Ya tienes cuenta?' : '¿No tienes cuenta?';
            document.getElementById('authToggleLink').innerText = isSignUp ? 'Inicia Sesión' : 'Regístrate';
        }

        // Manejo de Login y Registro
        async function handleAuth(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                if (isSignUp) {
                    const { error } = await _supabase.auth.signUp({ email, password });
                    if (error) throw error;
                    alert('Registro exitoso. ¡Revisa tu correo o inicia sesión!');
                } else {
                    const { error } = await _supabase.auth.signInWithPassword({ email, password });
                    if (error) throw error;
                }
                toggleAuthModal();
                await checkUser();
            } catch (error) {
                alert(error.message);
            }
        }

        async function handleLogout() {
            await _supabase.auth.signOut();
            await checkUser();
        }
    </script>
</body>
</html>
